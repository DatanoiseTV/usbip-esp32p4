name: Release

# Cuts a GitHub Release when a v* tag is pushed. The intended flow:
#   1. work on a dev-* branch (CI builds + uploads a binary artifact)
#   2. flash that artifact and PHYSICALLY TEST it on hardware
#   3. merge dev-* -> main
#   4. tag the release commit: git tag v1.2.3 && git push origin v1.2.3
# The tag build's embedded version string matches the tag, so the released
# binary is identified by its version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + merge binary
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          # merge-bin runs esptool from inside build/, so --output is relative to it
          command: idf.py build && idf.py merge-bin --output usbip-esp32p4-merged.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/usbip-esp32p4-merged.bin
            build/usbip-esp32p4.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          body: |
            ESP32-P4 USB/IP server firmware — built with ESP-IDF v6.0.2 for `esp32p4`.

            ## Flashing

            Download **`usbip-esp32p4-merged.bin`** below. It's a single combined
            image (bootloader + partition table + app) that flashes at offset `0x0`.

            Connect the board's **USB-C console port** (the one that shows up as a
            serial/COM port — not the USB-A host port for exported devices).

            ### Easiest — browser flasher, nothing to install

            Open **[esptool-js](https://espressif.github.io/esptool-js/)** in Chrome or
            Edge → *Connect* → pick the serial port → add `usbip-esp32p4-merged.bin` at
            offset `0x0` → *Program*.

            ### Or with esptool on the command line

            `pip install esptool`, then:

            ```
            esptool --chip esp32p4 -p <PORT> write-flash 0x0 usbip-esp32p4-merged.bin
            ```

            Replace `<PORT>` with your serial port (`COM3`, `/dev/ttyUSB0`, …), or omit
            `-p <PORT>` to auto-detect.

            If flashing can't sync, hold **BOOT**, tap **RESET**, release **BOOT**, retry.

            After flashing, reset the board and watch the console at **115200 baud** — it
            prints its IP address on boot. See the
            [README](https://github.com/ringof/usbip-esp32p4#readme) to attach devices.
